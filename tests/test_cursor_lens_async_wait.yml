---
# The Security async job fails the way Cursor's local database lock does:
# fail_json with a msg and no status, usage_normalized, or
# structured_tool_calls. failed_when: false on the old looped wait cleared
# that failed flag, so attempt 1 bound the error as a finished lens.
# review_structured_output_max_attempts is 1, so a bogus bind cannot be
# saved by a later retry. The wait must keep failed=true, redispatch, and
# bind the second stub response. The Review job's payload must survive the
# wait and bind unchanged.
#
# Requires tests/library/cursor_agent_stub.py and CURSOR_AGENT_STUB_FILE.
# scripts/run_playbook_tests.sh sets both.

- name: Cursor lens waits keep a failed start failed
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    review_prompt_nonce: "AbCdEfGh12345678"
    review_org_repo: aknochow/ansible-plaibook
    review_number: "97"
    review_repo_path: "{{ playbook_dir }}"
    review_cursor_api_key: stub-not-a-real-key
    review_cursor_model: gpt-5.6-luna
    review_cursor_effort: high
    review_structured_output_max_attempts: 1
    cursor_agent_module: cursor_agent_stub
    cursor_agent_stub_file: "{{ lookup('ansible.builtin.env', 'CURSOR_AGENT_STUB_FILE') | default(playbook_dir ~ '/.cursor_agent_stub.json', true) }}"
    security_system_prompt: security prompt
    review_system_prompt: review prompt
    _security_nested:
      findings: []
      scores: { security: 10 }
      prompt_nonce: "AbCdEfGh12345678"
    _review_nested:
      findings: []
      scores: { quality: 80 }
      prompt_nonce: "AbCdEfGh12345678"

  environment:
    CURSOR_AGENT_STUB_FILE: "{{ cursor_agent_stub_file }}"

  tasks:
    - name: Reset stub call counts so Security's first async call is the failure
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ cursor_agent_stub_file }}.counts"
        - "{{ cursor_agent_stub_file }}.lock"

    - name: Write per-agent stub payloads
      ansible.builtin.copy:
        dest: "{{ cursor_agent_stub_file }}"
        mode: "0600"
        content: "{{ _stub | to_json }}"
      vars:
        _stub:
          by_agent:
            security_lens:
              first:
                failed: true
                msg: "Cursor agent failed to start: internal: database is locked"
              then:
                status: finished
                resolved_model: gpt-5.6-luna
                usage_normalized:
                  input_tokens: 7
                  output_tokens: 1
                  cache_write_tokens: 0
                  cache_read_tokens: 0
                  thinking_tokens: 0
                  total_tokens: 8
                structured_tool_calls:
                  - name: report_findings
                    caller: nested
                    agent_id:
                    args: "{{ _security_nested }}"
            review_lens:
              status: finished
              resolved_model: gpt-5.6-luna
              usage_normalized:
                input_tokens: 30
                output_tokens: 4
                cache_write_tokens: 0
                cache_read_tokens: 0
                thinking_tokens: 0
                total_tokens: 34
              structured_tool_calls:
                - name: report_findings
                  caller: nested
                  agent_id:
                  args: "{{ _review_nested }}"

    - name: Dispatch both lenses through the real async wait
      ansible.builtin.include_role:
        name: review
        tasks_from: dispatch_lens_cursor

    - name: Confirm the failed start was redispatched and the finished lens was kept
      ansible.builtin.assert:
        that:
          - security_cursor_lens_valid | bool
          - review_cursor_lens_valid | bool
          - "'database is locked' not in (_cursor_security_raw.msg | default(''))"
          - _cursor_security_raw.usage_normalized.input_tokens | int == 7
          - _cursor_review_raw.usage_normalized.input_tokens | int == 30
          - >-
              (_cursor_review_raw.structured_tool_calls | default([])
              | selectattr('caller', 'equalto', 'nested') | list | length) > 0
          - >-
              (pipeline_agent_calls | selectattr('lens', 'equalto', 'security')
              | map(attribute='usage.input_tokens') | map('int') | list) == [7]
          - >-
              (pipeline_agent_calls | selectattr('lens', 'equalto', 'review')
              | map(attribute='usage.input_tokens') | map('int') | list) == [30]
        fail_msg: >-
          A failed async start must stay failed and be dispatched again.
          The finished Review payload must bind as-is.
          security_valid={{ security_cursor_lens_valid | default('') }}
          review_valid={{ review_cursor_lens_valid | default('') }}
          security_raw_msg={{ _cursor_security_raw.msg | default('') }}
          security_tokens={{ _cursor_security_raw.usage_normalized.input_tokens | default('') }}
          review_tokens={{ _cursor_review_raw.usage_normalized.input_tokens | default('') }}
          calls={{ pipeline_agent_calls | default([]) }}
        success_msg: "Failed start was redispatched; the finished Review lens was bound."
