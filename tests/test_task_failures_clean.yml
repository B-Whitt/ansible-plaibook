---
# A play with no failed tasks must leave PLAIBOOK_TASK_FAILURES_LOG empty.
# scripts/run_playbook_tests.sh creates that file and checks the size.

- name: Clean play writes no task-failure log
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Do nothing that fails
      ansible.builtin.debug:
        msg: clean play
