---
# Deterministic tests for the Cursor dispatch prompt_nonce canary and
# payload-bound HMAC attestation. No live model. Covers (1) the canary
# lands in the trusted lens prompt, (2) matching nonce+HMAC passes,
# (3) mismatch / missing HMAC / stolen HMAC fail closed naming
# fabrication and not printing .text or the HMAC key.
#
# Usage:
#   ansible-playbook tests/test_cursor_prompt_nonce.yml

- name: "Test prompt_nonce canary: schema, template, pass, fail-closed"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    severity_points:
      Critical: 20
      Major: 10
      Minor: 5
      Nit: 0
    domain_steering_blocks: []
    review_extra_notes: ""
    review_context: ""
    prior_review_md: ""
    existing_findings: []
    prior_round_findings: []
    finding:
      lens: Security
      severity: Major
      file: app.py
      line: 1
      description: test finding
      evidence: x = 1
      fix: don't
    new_finding:
      file: app.py
      line: 1
      description: test finding
    claimed_prior:
      file: app.py
      line: 1
      description: prior finding
    claiming_rationale: same location
    full_diff: |
      diff --git a/app.py b/app.py
      --- a/app.py
      +++ b/app.py
      @@ -1 +1,2 @@
      +x = 1
    review_prompt_nonce: "AbCdEfGh12345678"
    review_prompt_hmac_key: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    agent_family: cursor

  tasks:
    - name: Load the review role vars (schemas)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/review/vars/main.yml"

    - name: Assert prompt_nonce is required on the shared schemas
      ansible.builtin.assert:
        that:
          - "'prompt_nonce' in security_findings_schema.required"
          - "'prompt_nonce' in review_findings_schema.required"
          - "'prompt_nonce' in explore_findings_schema.required"
          - "'prompt_nonce' in verify_verdict_schema.required"
          - "'prompt_nonce' in continuity_audit_schema.required"
          - "'prompt_attestation' in security_findings_schema.properties"
          - "'prompt_attestation' in explore_findings_schema.properties"
          - "'prompt_attestation' in verify_verdict_schema.properties"
          - "'prompt_attestation' in continuity_audit_schema.properties"
          - security_findings_schema.additionalProperties == false
          - "'prompt_attestation' not in security_findings_schema.required"
          - "'prompt_attestation' not in review_findings_schema.required"
          - "'prompt_attestation' not in explore_findings_schema.required"
          - "'prompt_attestation' not in verify_verdict_schema.required"
          - "'prompt_attestation' not in continuity_audit_schema.required"
        fail_msg: "prompt_nonce must be required; prompt_attestation must stay optional on shared schemas."
        success_msg: "prompt_nonce is required; prompt_attestation is present and optional on shared schemas."

    - name: Assert Cursor structured_tool copies require prompt_attestation
      ansible.builtin.assert:
        that:
          - "'prompt_attestation' in cursor_security_findings_schema.required"
          - "'prompt_attestation' in cursor_review_findings_schema.required"
          - "'prompt_attestation' in cursor_explore_findings_schema.required"
          - "'prompt_attestation' in cursor_verify_verdict_schema.required"
          - "'prompt_attestation' in cursor_continuity_audit_schema.required"
          - "'prompt_nonce' in cursor_security_findings_schema.required"
          - "'prompt_nonce' in cursor_explore_findings_schema.required"
          - cursor_security_findings_schema.additionalProperties == false
          - cursor_security_findings_schema.properties.prompt_attestation.type == "string"
        fail_msg: "Cursor structured_tool schemas must require prompt_attestation without changing shared required."
        success_msg: "Cursor schema copies require prompt_attestation; shared schemas stay optional."

    - name: Render the Security lens prompt with the canary
      ansible.builtin.set_fact:
        _rendered_security_prompt: "{{ lookup('template', playbook_dir + '/../roles/review/templates/security_agent_prompt.j2') }}"

    - name: Render the Review lens prompt with the canary
      ansible.builtin.set_fact:
        _rendered_review_prompt: "{{ lookup('template', playbook_dir + '/../roles/review/templates/review_agent_prompt.j2') }}"

    - name: Render the Explore prompt with the canary
      ansible.builtin.set_fact:
        _rendered_explore_prompt: "{{ lookup('template', playbook_dir + '/../roles/review/templates/explore_agent_prompt.j2') }}"

    - name: Render the Verify prompt with the canary
      ansible.builtin.set_fact:
        _rendered_verify_prompt: "{{ lookup('template', playbook_dir + '/../roles/review/templates/verify_agent_prompt.j2') }}"

    - name: Render the continuity-audit prompt with the canary
      ansible.builtin.set_fact:
        _rendered_continuity_prompt: "{{ lookup('template', playbook_dir + '/../roles/review/templates/verify_continuity_audit_prompt.j2') }}"

    - name: Assert the nonce is in the trusted Cursor subagent prompts
      ansible.builtin.assert:
        that:
          - review_prompt_nonce in _rendered_security_prompt
          - review_prompt_nonce in _rendered_review_prompt
          - review_prompt_nonce in _rendered_explore_prompt
          - review_prompt_nonce in _rendered_verify_prompt
          - review_prompt_nonce in _rendered_continuity_prompt
          - "'Dispatch canary' in _rendered_security_prompt"
          - "'Dispatch canary' in _rendered_explore_prompt"
          - "'Dispatch canary' in _rendered_verify_prompt"
          - "'Dispatch canary' in _rendered_continuity_prompt"
          - "'prompt_attestation' in _rendered_security_prompt"
          - review_prompt_hmac_key in _rendered_security_prompt
          - review_prompt_hmac_key in _rendered_explore_prompt
        fail_msg: "Expected the per-run nonce and Cursor HMAC canary in the trusted prompts."
        success_msg: "Nonce and HMAC canary are embedded in the Cursor subagent prompts."

    - name: Matching nonce and payload HMAC must pass
      ansible.builtin.include_role:
        name: review
        tasks_from: assert_cursor_prompt_nonce
      vars:
        cursor_nonce_structured:
          findings: []
          scores: { security: 10 }
          prompt_nonce: "{{ review_prompt_nonce }}"
          prompt_attestation: "983793103fcc7fd1bfa9955d09fd72c1470449f6fa8ed74d4701a71fb858ecc6"
        cursor_nonce_lens_label: "Security lens"

    - name: Copied nonce without HMAC must fail closed
      block:
        - name: Assert findings:[] with a matching nonce and no attestation
          ansible.builtin.include_role:
            name: review
            tasks_from: assert_cursor_prompt_nonce
          vars:
            cursor_nonce_structured:
              findings: []
              scores: { security: 10 }
              prompt_nonce: "{{ review_prompt_nonce }}"
            cursor_nonce_lens_label: "Security lens"

        - name: Fail if a copied nonce without HMAC was accepted
          ansible.builtin.fail:
            msg: "Expected a missing prompt_attestation to fail closed."
      rescue:
        - name: Confirm missing HMAC fails closed without .text or the key
          ansible.builtin.assert:
            that:
              - "'fabricat' in (ansible_failed_result.msg | default('') | lower)"
              - "'.text' not in (ansible_failed_result.msg | default(''))"
              - review_prompt_hmac_key not in (ansible_failed_result.msg | default(''))
            fail_msg: >-
              Expected a fabrication-named fail_msg without .text or the HMAC key.
              Got: {{ ansible_failed_result.msg | default('') }}
            success_msg: "Copied nonce without HMAC fails closed, without printing .text or the key."

    - name: Mismatch must fail closed, name fabrication, and not print .text
      block:
        - name: Assert a fabricated findings:[] with the wrong nonce
          ansible.builtin.include_role:
            name: review
            tasks_from: assert_cursor_prompt_nonce
          vars:
            cursor_nonce_structured:
              findings: []
              scores: { security: 10 }
              prompt_nonce: "definitelyNotTheNonce"
              prompt_attestation: "983793103fcc7fd1bfa9955d09fd72c1470449f6fa8ed74d4701a71fb858ecc6"
            cursor_nonce_lens_label: "Security lens"

        - name: Fail if the fabricated nonce was accepted
          ansible.builtin.fail:
            msg: "Expected the prompt_nonce mismatch to fail closed."
      rescue:
        - name: Confirm the fail_msg names fabrication and omits .text
          ansible.builtin.assert:
            that:
              - "'fabricat' in (ansible_failed_result.msg | default('') | lower)"
              - "'.text' not in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              Expected a fabrication-named fail_msg without .text.
              Got: {{ ansible_failed_result.msg | default('') }}
            success_msg: "Mismatch fails closed naming fabrication, without printing .text."

    - name: HMAC of a different payload must fail closed (dropped findings)
      block:
        - name: Assert a copied nonce whose HMAC belongs to other findings
          ansible.builtin.include_role:
            name: review
            tasks_from: assert_cursor_prompt_nonce
          vars:
            cursor_nonce_structured:
              findings:
                - lens: Security
                  file: app.py
                  line: 1
                  severity: Critical
                  description: rce
                  evidence: eval(x)
                  confidence: HIGH
                  fix: don't
              scores: { security: 10 }
              prompt_nonce: "{{ review_prompt_nonce }}"
              prompt_attestation: "983793103fcc7fd1bfa9955d09fd72c1470449f6fa8ed74d4701a71fb858ecc6"
            cursor_nonce_lens_label: "Security lens"

        - name: Fail if a stolen HMAC for a different payload was accepted
          ansible.builtin.fail:
            msg: "Expected a payload-bound HMAC mismatch to fail closed."
      rescue:
        - name: Confirm dropped-findings HMAC fails closed without .text or the key
          ansible.builtin.assert:
            that:
              - "'prompt_attestation' in (ansible_failed_result.msg | default('') | lower)"
              - "'.text' not in (ansible_failed_result.msg | default(''))"
              - review_prompt_hmac_key not in (ansible_failed_result.msg | default(''))
              - "'eval(x)' not in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              Expected a payload HMAC fail_msg without .text, key, or evidence.
              Got: {{ ansible_failed_result.msg | default('') }}
            success_msg: "Dropped findings fail closed on HMAC mismatch, without printing .text or the key."
