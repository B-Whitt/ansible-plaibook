---
# Deterministic tests for the Cursor named-lens bind and prompt_nonce
# spawn canary. No live model. Covers:
#   (1) named-lens execute present → persist uses those args, not parent
#       last-call
#   (2) only parent execute → fail closed
#   (3) no execute → fail closed
#   (4) GetDynamicTools / tools: [mcp] fabrication (parent execute, no
#       nested) still fails closed
# Plus: prompt_nonce required on shared schemas; no prompt_attestation
# field and no Cursor schema copies; nonce lands in trusted prompts;
# fail_msg does not print .text, HMAC keys, or payloads.
#
# Usage:
#   ansible-playbook tests/test_cursor_prompt_nonce.yml

- name: "Test Cursor named-lens bind: schema, template, persist, fail-closed"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    severity_points:
      Critical: 20
      Major: 10
      Minor: 5
      Nit: 0
    domain_steering_blocks: []
    review_extra_notes: ""
    review_context: ""
    prior_review_md: ""
    existing_findings: []
    prior_round_findings: []
    finding:
      lens: Security
      severity: Major
      file: app.py
      line: 1
      description: test finding
      evidence: x = 1
      fix: don't
    new_finding:
      file: app.py
      line: 1
      description: test finding
    claimed_prior:
      file: app.py
      line: 1
      description: prior finding
    claiming_rationale: same location
    full_diff: |
      diff --git a/app.py b/app.py
      --- a/app.py
      +++ b/app.py
      @@ -1 +1,2 @@
      +x = 1
    review_prompt_nonce: "AbCdEfGh12345678"
    agent_family: cursor
    _nested_lens_args:
      findings:
        - lens: Security
          file: lens.py
          line: 10
          severity: Major
          description: from named lens
          evidence: planted
          confidence: HIGH
          fix: don't
      scores: { security: 10 }
      prompt_nonce: "AbCdEfGh12345678"
    _parent_fabricated_args:
      findings: []
      scores: { security: 99 }
      prompt_nonce: "AbCdEfGh12345678"

  tasks:
    - name: Load the review role vars (schemas)
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../roles/review/vars/main.yml"

    - name: Assert prompt_nonce is required and prompt_attestation is gone
      ansible.builtin.assert:
        that:
          - "'prompt_nonce' in security_findings_schema.required"
          - "'prompt_nonce' in review_findings_schema.required"
          - "'prompt_nonce' in explore_findings_schema.required"
          - "'prompt_nonce' in verify_verdict_schema.required"
          - "'prompt_nonce' in continuity_audit_schema.required"
          - "'prompt_attestation' not in security_findings_schema.properties"
          - "'prompt_attestation' not in review_findings_schema.properties"
          - "'prompt_attestation' not in explore_findings_schema.properties"
          - "'prompt_attestation' not in verify_verdict_schema.properties"
          - "'prompt_attestation' not in continuity_audit_schema.properties"
          - "'prompt_attestation' not in security_findings_schema.required"
          - security_findings_schema.additionalProperties == false
          - cursor_security_findings_schema is not defined
          - cursor_review_findings_schema is not defined
          - cursor_explore_findings_schema is not defined
          - cursor_verify_verdict_schema is not defined
          - cursor_continuity_audit_schema is not defined
        fail_msg: "prompt_nonce must be required; prompt_attestation and Cursor schema copies must be gone."
        success_msg: "prompt_nonce is required; no prompt_attestation; no Cursor schema copies."

    - name: Render the Security lens prompt with the canary
      ansible.builtin.set_fact:
        _rendered_security_prompt: "{{ lookup('template', playbook_dir + '/../roles/review/templates/security_agent_prompt.j2') }}"

    - name: Render the Review lens prompt with the canary
      ansible.builtin.set_fact:
        _rendered_review_prompt: "{{ lookup('template', playbook_dir + '/../roles/review/templates/review_agent_prompt.j2') }}"

    - name: Render the Explore prompt with the canary
      ansible.builtin.set_fact:
        _rendered_explore_prompt: "{{ lookup('template', playbook_dir + '/../roles/review/templates/explore_agent_prompt.j2') }}"

    - name: Render the Verify prompt with the canary
      ansible.builtin.set_fact:
        _rendered_verify_prompt: "{{ lookup('template', playbook_dir + '/../roles/review/templates/verify_agent_prompt.j2') }}"

    - name: Render the continuity-audit prompt with the canary
      ansible.builtin.set_fact:
        _rendered_continuity_prompt: "{{ lookup('template', playbook_dir + '/../roles/review/templates/verify_continuity_audit_prompt.j2') }}"

    - name: Assert the nonce is in the trusted Cursor subagent prompts
      ansible.builtin.assert:
        that:
          - review_prompt_nonce in _rendered_security_prompt
          - review_prompt_nonce in _rendered_review_prompt
          - review_prompt_nonce in _rendered_explore_prompt
          - review_prompt_nonce in _rendered_verify_prompt
          - review_prompt_nonce in _rendered_continuity_prompt
          - "'Dispatch canary' in _rendered_security_prompt"
          - "'Dispatch canary' in _rendered_explore_prompt"
          - "'Dispatch canary' in _rendered_verify_prompt"
          - "'Dispatch canary' in _rendered_continuity_prompt"
          - "'prompt_attestation' not in _rendered_security_prompt"
          - "'prompt_attestation' not in _rendered_explore_prompt"
          - "'HMAC' not in _rendered_security_prompt"
          - "'hmac' not in _rendered_security_prompt"
        fail_msg: "Expected the per-run nonce in trusted prompts, with no HMAC / prompt_attestation."
        success_msg: "Nonce is embedded in the Cursor subagent prompts; HMAC canary is gone."

    - name: Named-lens execute present must persist those args, not parent last-call
      block:
        - name: Select nested execute when parent called last
          ansible.builtin.include_role:
            name: review
            tasks_from: select_cursor_named_lens
          vars:
            cursor_raw:
              structured: "{{ _parent_fabricated_args }}"
              structured_tool_calls:
                - name: report_findings
                  caller: nested
                  agent_id:
                  args: "{{ _nested_lens_args }}"
                - name: report_findings
                  caller: parent
                  agent_id: parent-1
                  args: "{{ _parent_fabricated_args }}"
            cursor_nonce_lens_label: "Security lens"
            cursor_lens_tool: report_findings
            cursor_named_lens_required: true

        - name: Persist from named-lens args the way dispatch_lens_cursor.yml does
          ansible.builtin.set_fact:
            _persisted_security:
              structured:
                findings: "{{ cursor_lens_structured.findings | default([]) }}"
                scores: "{{ cursor_lens_structured.scores | default({}) }}"

        - name: Confirm persist used nested args, not last-call parent
          ansible.builtin.assert:
            that:
              - cursor_named_lens_present | bool
              - cursor_lens_structured.findings[0].file == "lens.py"
              - cursor_lens_structured.findings[0].description == "from named lens"
              - _persisted_security.structured.findings[0].file == "lens.py"
              - _persisted_security.structured.scores.security == 10
              - _persisted_security.structured.findings | length == 1
            fail_msg: "Named-lens execute must win persist; last-call parent args must be ignored."
            success_msg: "Named-lens execute present; persist used nested args."

        - name: Matching nested nonce must pass
          ansible.builtin.include_role:
            name: review
            tasks_from: assert_cursor_prompt_nonce
          vars:
            cursor_nonce_structured: "{{ cursor_lens_structured }}"
            cursor_nonce_lens_label: "Security lens"

    - name: Only parent execute must fail closed
      block:
        - name: Select when only the parent called the tool
          ansible.builtin.include_role:
            name: review
            tasks_from: select_cursor_named_lens
          vars:
            cursor_raw:
              structured: "{{ _parent_fabricated_args }}"
              structured_tool_calls:
                - name: report_findings
                  caller: parent
                  agent_id: parent-1
                  args: "{{ _parent_fabricated_args }}"
            cursor_nonce_lens_label: "Security lens"
            cursor_lens_tool: report_findings
            cursor_named_lens_required: true

        - name: Fail if a parent-only execute was accepted
          ansible.builtin.fail:
            msg: "Expected a parent-only execute to fail closed."
      rescue:
        - name: Confirm parent-only fails closed without .text or payload
          ansible.builtin.assert:
            that:
              - "'parent' in (ansible_failed_result.msg | default('') | lower)"
              - "'.text' not in (ansible_failed_result.msg | default(''))"
              - "'HMAC' not in (ansible_failed_result.msg | default(''))"
              - "'hmac' not in (ansible_failed_result.msg | default(''))"
              - "'from named lens' not in (ansible_failed_result.msg | default(''))"
              - "'planted' not in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              Expected a parent-execute fail_msg without .text, HMAC, or payload.
              Got: {{ ansible_failed_result.msg | default('') }}
            success_msg: "Parent-only execute fails closed, without printing .text or payload."

    - name: No execute must fail closed
      block:
        - name: Select when structured_tool_calls is empty
          ansible.builtin.include_role:
            name: review
            tasks_from: select_cursor_named_lens
          vars:
            cursor_raw:
              structured_tool_calls: []
            cursor_nonce_lens_label: "Security lens"
            cursor_lens_tool: report_findings
            cursor_named_lens_required: true

        - name: Fail if a missing execute was accepted
          ansible.builtin.fail:
            msg: "Expected no nested execute to fail closed."
      rescue:
        - name: Confirm no-execute fails closed without .text
          ansible.builtin.assert:
            that:
              - "'never called' in (ansible_failed_result.msg | default('') | lower) or 'no nested' in (ansible_failed_result.msg | default('') | lower)"
              - "'.text' not in (ansible_failed_result.msg | default(''))"
              - "'HMAC' not in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              Expected a missing-execute fail_msg without .text or HMAC.
              Got: {{ ansible_failed_result.msg | default('') }}
            success_msg: "No execute fails closed, without printing .text."

    - name: GetDynamicTools / tools [mcp] fabrication path must fail closed
      block:
        - name: Select a parent mcp execute with no nested call
          ansible.builtin.include_role:
            name: review
            tasks_from: select_cursor_named_lens
          vars:
            cursor_raw:
              structured: "{{ _parent_fabricated_args }}"
              structured_tool_calls:
                - name: report_findings
                  caller: parent
                  agent_id: parent-1
                  tool_call_id: parent-mcp-call
                  args: "{{ _parent_fabricated_args }}"
            cursor_nonce_lens_label: "Security lens"
            cursor_lens_tool: report_findings
            cursor_named_lens_required: true

        - name: Fail if a tools [mcp] parent fabricate was accepted
          ansible.builtin.fail:
            msg: "Expected GetDynamicTools / tools: [mcp] fabrication to fail closed."
      rescue:
        - name: Confirm mcp-only fabrication fails closed without .text or payload
          ansible.builtin.assert:
            that:
              - "'GetDynamicTools' in (ansible_failed_result.msg | default('')) or 'parent' in (ansible_failed_result.msg | default('') | lower)"
              - "'.text' not in (ansible_failed_result.msg | default(''))"
              - "'HMAC' not in (ansible_failed_result.msg | default(''))"
              - "'hmac' not in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              Expected a fabrication fail_msg without .text or HMAC.
              Got: {{ ansible_failed_result.msg | default('') }}
            success_msg: "tools: [mcp] parent fabricate fails closed, without printing .text."

    - name: Mismatch must fail closed, name fabrication, and not print .text
      block:
        - name: Assert a fabricated findings:[] with the wrong nonce
          ansible.builtin.include_role:
            name: review
            tasks_from: assert_cursor_prompt_nonce
          vars:
            cursor_nonce_structured:
              findings: []
              scores: { security: 10 }
              prompt_nonce: "definitelyNotTheNonce"
            cursor_nonce_lens_label: "Security lens"

        - name: Fail if the fabricated nonce was accepted
          ansible.builtin.fail:
            msg: "Expected the prompt_nonce mismatch to fail closed."
      rescue:
        - name: Confirm the fail_msg names fabrication and omits .text
          ansible.builtin.assert:
            that:
              - "'fabricat' in (ansible_failed_result.msg | default('') | lower)"
              - "'.text' not in (ansible_failed_result.msg | default(''))"
              - "'HMAC' not in (ansible_failed_result.msg | default(''))"
            fail_msg: >-
              Expected a fabrication-named fail_msg without .text.
              Got: {{ ansible_failed_result.msg | default('') }}
            success_msg: "Nonce mismatch fails closed naming fabrication, without printing .text."
