---
# Layered under Red Hat's org-mandated rh-multi-pre-commit hook (see
# .git/hooks/pre-commit) -- rh-multi-pre-commit runs pre-commit.com
# style hooks like this one ALONGSIDE its own mandatory checks, so
# nothing here replaces or competes with the required security
# scanning. Registered/synced via `rh-multi-pre-commit update`, not
# `pre-commit install` (which would overwrite the org-mandated hook
# dispatcher).
#
# `language: system` plus `uv run` uses the lockfile tools. The
# upstream ansible-lint hook builds its own venv, which fails on
# Python 3.14. These hooks are the same commands CI runs, so a
# failure shows up before the GitHub job.
#
# scripts/agent-commit.sh sets core.hooksPath=/dev/null. Before
# pushing, run `uv run ruff check`, `uv run ansible-lint --offline`,
# and `uv run ./scripts/run_playbook_tests.sh`.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false
      - id: ansible-lint
        name: ansible-lint
        entry: uv run ansible-lint --offline
        language: system
        files: \.(yml|yaml)$
        pass_filenames: false
      - id: offline-playbook-tests
        name: offline playbook tests
        entry: uv run ./scripts/run_playbook_tests.sh
        language: system
        files: \.(py|yml|yaml)$
        pass_filenames: false
