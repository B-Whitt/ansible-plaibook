name: Notify plaibook pin bump

# Called from aknochow collection repos on push to their default branch.
# GITHUB_TOKEN in those repos cannot create a workflow run here. The
# caller mints a plai-crew installation token and passes it as
# dispatch_token. This workflow does not receive the app private key.
# An empty token is a no-op so collection CI stays green.

on:
  workflow_call:
    secrets:
      dispatch_token:
        required: false

permissions: {}

jobs:
  dispatch:
    name: repository_dispatch collection-pin-bump
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch ansible-plaibook pin bump
        env:
          GH_TOKEN: ${{ secrets.dispatch_token }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "dispatch token is unset; plaibook keeps the weekly schedule"
            exit 0
          fi
          gh api repos/aknochow/ansible-plaibook/dispatches \
            -f event_type=collection-pin-bump \
            -f "client_payload[repository]=${SOURCE_REPO}" \
            -f "client_payload[sha]=${SOURCE_SHA}" \
            -f "client_payload[ref]=${SOURCE_REF}"
