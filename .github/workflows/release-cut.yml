name: Cut a GitHub release

# workflow_dispatch only. Reads the version on main, refuses if v<version>
# already exists, and creates that tag plus a non-prerelease Release on
# the current main commit.
#
# Authentication is a GitHub App installation token from the release
# environment (RELEASE_GITHUB_APP_ID and RELEASE_GITHUB_APP_PRIVATE_KEY).
# GITHUB_TOKEN is not used. A release created with GITHUB_TOKEN does not
# trigger publish.yml or ee-publish.yml. publish.yml stays on
# release: published, and the pypi environment remains the upload gate.
# This workflow does not upload to PyPI and does not pin the review Action.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-cut
  cancel-in-progress: false

jobs:
  cut:
    name: Tag and publish the release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          ref: main
          persist-credentials: false

      - name: Require the release GitHub App credentials
        env:
          RELEASE_GITHUB_APP_ID: ${{ secrets.RELEASE_GITHUB_APP_ID }}
          RELEASE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_GITHUB_APP_ID}" ] || [ -z "${RELEASE_GITHUB_APP_PRIVATE_KEY}" ]; then
            echo "RELEASE_GITHUB_APP_ID and RELEASE_GITHUB_APP_PRIVATE_KEY are unset. Set them on the release environment. A release created with GITHUB_TOKEN does not trigger publish.yml or ee-publish.yml." >&2
            exit 1
          fi

      - name: Create the tag and GitHub Release
        env:
          RELEASE_GITHUB_APP_ID: ${{ secrets.RELEASE_GITHUB_APP_ID }}
          RELEASE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.RELEASE_GITHUB_APP_PRIVATE_KEY }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: python3 scripts/release_cut.py --repo "$GITHUB_REPOSITORY"
