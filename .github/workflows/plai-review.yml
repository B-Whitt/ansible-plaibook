name: plai

# Starts on a pull request and waits until the other checks on that
# commit have passed, then posts the review. The checks are plai / wait
# and plai / review. Re-run with a pull-request comment that
# starts with /plai-review, or workflow_dispatch. Those reruns post
# another review. They do not update the pull_request job check that
# branch protection sees. A newer push or comment for the same pull
# request cancels the in-flight run.
# This file calls the reusable workflow at an immutable commit, not a
# same-repository path. A path call would run the pull request's copy of
# that file with CURSOR_API_KEY and the GitHub App private key. The
# called workflow checks out a fixed commit of this repository. This
# caller does not pass a ref. The caller grants contents:read,
# pull-requests:read, and checks:read. The called job
# keeps that read-only token. Posting uses the GitHub App installation
# token. PLAI_GITHUB_APP_ID and PLAI_GITHUB_APP_PRIVATE_KEY post the
# review as the GitHub App whose slug is plai-review.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions: {}

concurrency:
  group: plaibook-review-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: plai
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository
      )
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && !endsWith(github.event.comment.user.login, '[bot]')
        && startsWith(github.event.comment.body, '/plai-review')
        && (
          github.event.comment.author_association == 'OWNER'
          || github.event.comment.author_association == 'MEMBER'
          || github.event.comment.author_association == 'COLLABORATOR'
        )
      )
    permissions:
      contents: read
      pull-requests: read
      checks: read
    uses: aknochow/ansible-plaibook/.github/workflows/plai-review-run.yml@1814e438f28db57f2f54dd3ae2e80291267eafb3
    secrets:
      cursor_api_key: ${{ secrets.CURSOR_API_KEY }}
      github_app_id: ${{ secrets.PLAI_GITHUB_APP_ID }}
      github_app_private_key: ${{ secrets.PLAI_GITHUB_APP_PRIVATE_KEY }}
