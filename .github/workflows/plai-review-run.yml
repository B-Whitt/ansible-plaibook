name: plaibook review

# Runs plai review on this runner after the other checks on the pull
# request have passed, then posts one pull request review. Does not call
# a controller. post_results stays false. The provider is cursor. Sibling
# repositories must call this file at a full commit SHA because it receives
# CURSOR_API_KEY. PLAI_GITHUB_APP_ID and PLAI_GITHUB_APP_PRIVATE_KEY post
# that review as the app (name the app plai-review). The job token is contents:read and
# pull-requests:read, so it cannot write the pull request. Posting uses
# the GitHub App installation token, and only in the publish step, after
# the agent has finished. The review step installs OpenShell with the
# upstream installer, which starts a local gateway. The community sandbox
# image embeds a policy this gateway cannot activate, so the job sets a
# global policy first, then runs plai review with the default sandbox.
# CURSOR_API_KEY stays in that step because the
# Cursor SDK call runs on the controller. The job token is read-only and
# is used to fetch the pull request. Tool execution runs in the sandbox.
#
# The workflow job is the pull-request check. This job does not call
# the Checks API. The runner is ubuntu-26.04-arm. One paired run of this
# review finished the agent step in 12m40s there and 14m31s on
# ubuntu-26.04. Both labels are free for this public repository.

on:
  workflow_call:
    inputs:
      source_sha:
        description: 40-character commit of this workflow. Required for a caller in another repository.
        required: false
        type: string
      source_repository:
        description: owner/name that contains this workflow.
        required: false
        type: string
    secrets:
      cursor_api_key:
        required: true
      github_app_id:
        required: false
      github_app_private_key:
        required: false

permissions: {}

jobs:
  review:
    name: plaibook review
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require a full commit SHA for this workflow
        id: pin
        env:
          # inputs.source_sha is the pin an external caller passes.
          # job.workflow_sha is the called workflow file on github.com when
          # that input is empty. github.workflow_sha is the caller, so an
          # external uses: ...@<sha> must not check that out.
          INPUT_SHA: ${{ inputs.source_sha }}
          INPUT_REPOSITORY: ${{ inputs.source_repository }}
          PIN_SHA: ${{ job.workflow_sha }}
          PIN_REPOSITORY: ${{ job.workflow_repository }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-}"
          repository="${INPUT_REPOSITORY:-}"
          if [ -z "$sha" ]; then
            sha="${PIN_SHA:-}"
          fi
          if [ -z "$repository" ]; then
            repository="${PIN_REPOSITORY:-aknochow/ansible-plaibook}"
          fi
          if [ "${#sha}" -ne 40 ]; then
            if [ "${GITHUB_REPOSITORY}" = "aknochow/ansible-plaibook" ]; then
              sha="${GITHUB_SHA}"
            else
              echo "reusable workflow ref must be a 40-character commit SHA" >&2
              exit 1
            fi
          fi
          case "$sha" in
            *[!0-9a-f]*)
              echo "reusable workflow ref must be a 40-character commit SHA" >&2
              exit 1
              ;;
          esac
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"

      - name: Check out the pinned plaibook workflow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          repository: ${{ steps.pin.outputs.repository }}
          ref: ${{ steps.pin.outputs.sha }}
          persist-credentials: false

      - name: Resolve the pull request
        id: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/github_pr_review.py resolve >> "$GITHUB_OUTPUT"

      - name: Wait until the other checks on this commit have passed
        id: gate
        if: steps.target.outputs.action == 'review'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ steps.target.outputs.repo }}
          SHA: ${{ steps.target.outputs.sha }}
          MERGE: ${{ steps.target.outputs.merge_sha }}
          TRIGGER: ${{ steps.target.outputs.trigger }}
          IGNORE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gate_sha="$(python3 scripts/github_pr_review.py gate-sha --repo "$REPO" --head "$SHA" --merge "$MERGE" --ignore-run-id "$IGNORE_RUN_ID")"
          echo "gate sha ${gate_sha}"
          attempts=1
          if [ "$TRIGGER" != "workflow_run" ]; then
            attempts=100
          fi
          state=waiting
          for _ in $(seq 1 "$attempts"); do
            set +e
            state="$(python3 scripts/github_pr_review.py gate --repo "$REPO" --sha "$gate_sha" --ignore-run-id "$IGNORE_RUN_ID")"
            rc=$?
            set -e
            echo "gate ${state}"
            if [ "$rc" -eq 0 ]; then
              echo "state=passed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$rc" -eq 20 ]; then
              echo "state=failed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$rc" -ne 10 ]; then
              echo "gate exited ${rc}" >&2
              exit 1
            fi
            if [ "$attempts" -eq 1 ]; then
              echo "state=waiting" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "state=waiting" >> "$GITHUB_OUTPUT"

      - name: Stop when the other checks have not passed
        if: >-
          steps.target.outputs.action == 'review' &&
          (steps.gate.outputs.state == 'failed' ||
           (steps.gate.outputs.state == 'waiting' && steps.target.outputs.trigger != 'workflow_run'))
        run: |
          set -euo pipefail
          if [ "${{ steps.gate.outputs.state }}" = "failed" ]; then
            echo "Other checks failed. plaibook review runs only after they pass. No review ran."
          else
            echo "Other checks are still running. plaibook review runs only after they pass."
          fi
          exit 1

      - name: Require CURSOR_API_KEY
        id: provider
        if: steps.gate.outputs.state == 'passed'
        env:
          CURSOR_API_KEY: ${{ secrets.cursor_api_key }}
        run: |
          set -euo pipefail
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "CURSOR_API_KEY is unset. No review ran."
            exit 1
          fi
          echo "CURSOR_API_KEY is present"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.provider.outputs.ready == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install plaibook from this commit
        if: steps.provider.outputs.ready == 'true'
        run: |
          set -euo pipefail
          uv python install 3.12
          uv venv "$RUNNER_TEMP/plai-venv"
          uv pip install --python "$RUNNER_TEMP/plai-venv/bin/python" .

      - name: Install OpenShell
        if: steps.provider.outputs.ready == 'true'
        run: |
          set -euo pipefail
          curl -LsSf https://raw.githubusercontent.com/NVIDIA/OpenShell/main/install.sh | sh
          if ! command -v openshell >/dev/null 2>&1 && [ -x "$HOME/.local/bin/openshell" ]; then
            export PATH="$HOME/.local/bin:$PATH"
          fi
          openshell status

      - name: Replace the image policy and pull the review sandbox
        if: steps.provider.outputs.ready == 'true'
        env:
          OPENSHELL_WORKSPACE: default
          OPENSHELL_PROVISION_TIMEOUT: "180"
        run: |
          set -euo pipefail
          # ghcr.io/nvidia/openshell-community/sandboxes/base:latest embeds
          # /etc/openshell/policy.yaml. On this gateway that policy stays
          # ConfigurationInvalid until the 300s repair window expires, so
          # the sandbox never reaches Ready. A global policy replaces the
          # image policy. Model calls stay on the controller, so the guest
          # does not need the image's network rules.
          cat > "$RUNNER_TEMP/plaibook-sandbox-policy.yaml" <<'EOF'
          version: 1
          filesystem_policy:
            include_workdir: true
            read_only:
              - /usr
              - /lib
              - /bin
              - /proc
              - /dev/urandom
              - /etc
              - /var/log
            read_write:
              - /sandbox
              - /tmp
              - /dev/null
          landlock:
            compatibility: best_effort
          EOF
          openshell policy set --global --yes --policy "$RUNNER_TEMP/plaibook-sandbox-policy.yaml"
          image="ghcr.io/nvidia/openshell-community/sandboxes/base:latest"
          if ! timeout 300 openshell sandbox create \
            --name plaibook-image-warm \
            --from "$image" \
            --detach \
            --no-tty; then
            openshell sandbox get plaibook-image-warm || true
            journalctl --user -u openshell-gateway --no-pager -n 40 || true
            exit 1
          fi
          openshell sandbox delete plaibook-image-warm

      - name: Run plai review
        id: plai
        if: steps.provider.outputs.ready == 'true'
        env:
          # This job's token cannot write the pull request.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          CURSOR_API_KEY: ${{ secrets.cursor_api_key }}
          ANSIBLE_REVIEW_AGENT_FAMILY: cursor
          # OpenShell 0.1 rejects an empty workspace. The CLI default is "default".
          OPENSHELL_WORKSPACE: default
        run: |
          set -euo pipefail
          set +e
          "$RUNNER_TEMP/plai-venv/bin/plai" review \
            "${{ steps.target.outputs.repo }}/${{ steps.target.outputs.pr }}" \
            --json \
            --force \
            -v \
            -e review_require_ci_passing=false \
            -e sandbox_wait_timeout=600 \
            > "${RUNNER_TEMP}/plai-review.json"
          rc=$?
          set -e
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"

      - name: Post the review
        if: always() && steps.plai.outputs.rc != ''
        env:
          PLAI_GITHUB_APP_ID: ${{ secrets.github_app_id }}
          PLAI_GITHUB_APP_PRIVATE_KEY: ${{ secrets.github_app_private_key }}
        run: |
          set -euo pipefail
          if [ -z "${PLAI_GITHUB_APP_ID}" ] || [ -z "${PLAI_GITHUB_APP_PRIVATE_KEY}" ]; then
            echo "PLAI_GITHUB_APP_ID and PLAI_GITHUB_APP_PRIVATE_KEY are required to post. This job token cannot write the pull request." >&2
            exit 1
          fi
          token="$(python3 scripts/github_app_token.py --repo "${{ steps.target.outputs.repo }}")"
          echo "::add-mask::${token}"
          GITHUB_TOKEN="${token}" python3 scripts/github_pr_review.py publish \
            --repo "${{ steps.target.outputs.repo }}" \
            --sha "${{ steps.target.outputs.sha }}" \
            --pr "${{ steps.target.outputs.pr }}" \
            --result "${RUNNER_TEMP}/plai-review.json" \
            --review-rc "${{ steps.plai.outputs.rc }}"
