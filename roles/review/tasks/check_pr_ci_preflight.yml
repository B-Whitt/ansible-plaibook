---
# Query/evaluate target PR/MR CI status before cloning or dispatching lens agents.
# If CI is failing on the PR head commit and review_require_ci_passing is true,
# stop early and record a SKIPPED verdict to avoid model spend on known-broken code.
# review_triage_ci_failures explains those checks instead, and still does not
# dispatch lenses or post a review. The two modes together are an error.
# If no CI checks exist (ci_status: none), or checks are running/passing, or if
# review_require_ci_passing is false, review proceeds normally.
# --triage-ci on green or still-running CI stops with nothing to triage.

- name: Reject reviewing and triaging CI at the same time
  when:
    - review_triage_ci_failures | default(false) | bool
    - not (review_require_ci_passing | default(true) | bool)
  ansible.builtin.fail:
    msg: >-
      Pass only one of --ignore-ci and --triage-ci
      (-e review_require_ci_passing=false or -e review_triage_ci_failures=true).

- name: Determine if CI preflight check is failing
  ansible.builtin.set_fact:
    review_ci_preflight_failed: >-
      {{
        (review_require_ci_passing | default(true) | bool)
        and ((_pr_context.ci_status | default('none')) == 'failing')
      }}
    review_ci_failing_checks: "{{ _pr_context.failing_checks | default([]) }}"

- name: Nothing to triage when CI is not failing
  when:
    - review_triage_ci_failures | default(false) | bool
    - not (review_ci_preflight_failed | bool)
  block:
    - name: Record that there is nothing to triage
      ansible.builtin.set_fact:
        review_verdict: "NOTHING_TO_TRIAGE"
        review_ci_preflight_failed: true
        review_skip_reason: "CI is not failing. There is nothing to triage."
        pipeline_findings_reports: >-
          {{ (pipeline_findings_reports | default([])) + [{
            'target': review_org_repo + '#' + review_number,
            'title': _pr_context.title | default(''),
            'url': _pr_context.url | default(''),
            'report': 'CI is not failing. There is nothing to triage.',
            'verdict': 'NOTHING_TO_TRIAGE',
            'summary_path': '',
            'findings_path': '',
            'summary_run_scoped_path': '',
            'findings_run_scoped_path': '',
            'ci_preflight_failed': false,
            'skip_reason': 'CI is not failing. There is nothing to triage.',
            'skip_hint': '',
            'cache_hit': false,
            'failing_checks': []
          }] }}

- name: Explain failing CI checks without dispatching lenses
  when:
    - review_triage_ci_failures | default(false) | bool
    - review_ci_preflight_failed | bool
    - (_pr_context.ci_status | default('none')) == 'failing'
  block:
    - name: Collect annotations and log tails for the failing checks
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python | default('python3') }}"
          - "{{ role_path }}/files/pr_review/triage_ci_failures.py"
        stdin: >-
          {{
            {
              'platform': review_platform | default(''),
              'hostname': review_hostname | default(''),
              'project': review_org_repo | default(''),
              'failing_checks': review_ci_failing_checks
            } | to_json
          }}
      register: review_ci_triage_raw
      changed_when: false

    - name: Record the CI diagnosis
      ansible.builtin.set_fact:
        review_verdict: "CI_TRIAGE"
        review_ci_diagnoses: "{{ review_ci_triage_raw.stdout | from_json }}"
        review_skip_reason: >-
          CI checks are failing. Lenses were not dispatched.
          This is a diagnosis, not a review.

    - name: Render the CI diagnosis report
      ansible.builtin.set_fact:
        _ci_triage_report: "{{ lookup('template', role_path + '/templates/ci_triage.md.j2') }}"

    - name: Record the CI diagnosis in pipeline_findings_reports
      ansible.builtin.set_fact:
        pipeline_findings_reports: >-
          {{ (pipeline_findings_reports | default([])) + [{
            'target': review_org_repo + '#' + review_number,
            'title': _pr_context.title | default(''),
            'url': _pr_context.url | default(''),
            'report': _ci_triage_report,
            'verdict': 'CI_TRIAGE',
            'summary_path': '',
            'findings_path': '',
            'summary_run_scoped_path': '',
            'findings_run_scoped_path': '',
            'ci_preflight_failed': false,
            'ci_triage': true,
            'ci_diagnoses': review_ci_diagnoses,
            'skip_reason': review_skip_reason,
            'skip_hint': '',
            'cache_hit': false,
            'failing_checks': review_ci_failing_checks | default([])
          }] }}

- name: Handle failing CI preflight check (stop early to avoid model spend)
  when:
    - review_ci_preflight_failed | bool
    - not (review_triage_ci_failures | default(false) | bool)
  block:
    - name: Set facts for skipped review due to failing CI
      ansible.builtin.set_fact:
        review_verdict: "SKIPPED"
        score_overall: 0.0
        review_short_sha: "{{ (_pr_context.head_sha | default('', true))[:7] }}"
        review_branch: "{{ review_platform }}-{{ review_org_repo | regex_replace('/', '-') }}-{{ review_number }}"
        review_skip_reason: >-
          CI checks are failing on the PR head commit
          ({{ _pr_context.head_sha | default('unknown', true) }}).
          Lens agents were not dispatched.
        review_skip_hint: >-
          Pass `--ignore-ci` (`-e review_require_ci_passing=false`) to review anyway,
          or `--triage-ci` (`-e review_triage_ci_failures=true`) to explain the failures
          without dispatching lenses.

    - name: Render skipped review report
      ansible.builtin.set_fact:
        _ci_preflight_report: "{{ lookup('template', role_path + '/templates/ci_preflight_skipped.md.j2') }}"

    - name: Notice that review was skipped due to failing CI checks
      ansible.builtin.debug:
        msg: >-
          CI checks are failing on {{ review_org_repo }}#{{ review_number }}.
          Review skipped before lens dispatch (review_verdict=SKIPPED).
          {{ review_skip_hint }}

    - name: Record skipped review in pipeline_findings_reports
      ansible.builtin.set_fact:
        pipeline_findings_reports: >-
          {{ (pipeline_findings_reports | default([])) + [{
            'target': review_org_repo + '#' + review_number,
            'title': _pr_context.title | default(''),
            'url': _pr_context.url | default(''),
            'report': _ci_preflight_report,
            'verdict': 'SKIPPED',
            'score': 0.0,
            'summary_path': '',
            'findings_path': '',
            'summary_run_scoped_path': '',
            'findings_run_scoped_path': '',
            'ci_preflight_failed': true,
            'skip_reason': review_skip_reason,
            'skip_hint': review_skip_hint,
            'cache_hit': false,
            'failing_checks': review_ci_failing_checks | default([])
          }] }}
