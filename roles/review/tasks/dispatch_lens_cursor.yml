---
# Cursor lens dispatch (agent_family: cursor). Uses aknochow.cursor.agent
# (cursor-sdk local Agent.prompt), not an OpenAI-compatible chat client.
#
# When review.yml started a playbook-owned sidecar, this task inherits
# CURSOR_SDK_BRIDGE_URL_FILE / CURSOR_SDK_BRIDGE_TOKEN_FILE (paths only)
# and attaches instead of nested launch_bridge.
#
# Module contract (measured 2026-09-06; live ping 2026-09-06 rc 0 with
# structured present):
# - No parent system_prompt. Trusted lens text lives in agents.*.prompt
#   on one subagent.
# - No generation-time output_format: json_schema. structured_tool
#   (report_findings) takes the same schema claude_cli passes to
#   output_format.schema. The model may skip the tool; the asserts
#   below fail loudly if .structured is absent.
# - prompt_nonce canary: the nonce is in agents.*.prompt (the
#   subagent), not the parent user message. Matching it rules out
#   "the subagent never ran." It does NOT rule out "the subagent ran
#   and the parent dropped its findings," and a parent could
#   theoretically copy the nonce from the billed agents.*.prompt.
#   Do not treat a matching nonce as proof the relay was faithful.
# - Do not print .text in fail_msg (lens drafts can quote secrets).
# - cwd is review_repo_path; setting_sources is [] so the repo under
#   review does not leak CLAUDE.md / Cursor rules into the session.
# - tools: [mcp, task] -- mcp is required for structured_tool
#   (tools=[] hides custom tools). task is required to spawn named
#   agents (SDK docs: disallowing task prevents subagents). [mcp]
#   alone hides task / Subagent; luna then fabricates findings: []
#   via GetDynamicTools and the nonce assert is what makes that fail
#   closed. Do not "fix" this back to [mcp].
# - Parent prompt must name the Task / Subagent tool and tell the
#   parent to spawn the named agent, then call report_findings. Do
#   not say "Use the X agent" as if X were a tool -- that is what
#   sent luna into GetDynamicTools. Do not put the untrusted diff
#   on the parent user prompt.
#
# Sets security_result/review_result in the SAME normalized shape
# dispatch_lens_claude_cli.yml produces: .structured.{findings,scores},
# .resolved_model, .usage_normalized. No observed_cost_usd -- cursor-sdk
# RunResult has no USD on the one-shot path.

- name: "Cursor: show the Security agent's request configuration"
  ansible.builtin.debug:
    msg: "{{ [
      'model: ' + review_cursor_model,
      'effort: ' + review_cursor_effort,
      'cwd: ' + review_repo_path,
      'setting_sources: []',
      'tools: [mcp, task]',
      'structured_tool: report_findings (security_findings_schema)',
      '',
      '--- subagent prompt ---',
      ] + security_system_prompt.split('\n') }}"

- name: "Cursor: dispatch the Security agent"
  aknochow.cursor.agent:
    api_key: "{{ review_cursor_api_key }}"
    prompt: >-
      Spawn the security_lens subagent with the Task / Subagent tool,
      then call report_findings with that subagent's findings and
      scores. You must call the Task / Subagent tool -- security_lens
      is not itself a tool. You must call report_findings.
    model: "{{ review_cursor_model }}"
    effort: "{{ review_cursor_effort }}"
    cwd: "{{ review_repo_path }}"
    setting_sources: []
    tools: [mcp, task]
    agents:
      security_lens:
        description: Security review lens with trusted instructions.
        prompt: "{{ security_system_prompt }}"
    structured_tool:
      name: report_findings
      description: Submit the security findings and scores for this diff.
      input_schema: "{{ security_findings_schema }}"
  register: _cursor_security_raw

- name: "Cursor: show the Review agent's request configuration"
  ansible.builtin.debug:
    msg: "{{ [
      'model: ' + review_cursor_model,
      'effort: ' + review_cursor_effort,
      'cwd: ' + review_repo_path,
      'setting_sources: []',
      'tools: [mcp, task]',
      'structured_tool: report_findings (review_findings_schema)',
      '',
      '--- subagent prompt ---',
      ] + review_system_prompt.split('\n') }}"

- name: "Cursor: dispatch the Review agent"
  aknochow.cursor.agent:
    api_key: "{{ review_cursor_api_key }}"
    prompt: >-
      Spawn the review_lens subagent with the Task / Subagent tool,
      then call report_findings with that subagent's findings and
      scores. You must call the Task / Subagent tool -- review_lens
      is not itself a tool. You must call report_findings.
    model: "{{ review_cursor_model }}"
    effort: "{{ review_cursor_effort }}"
    cwd: "{{ review_repo_path }}"
    setting_sources: []
    tools: [mcp, task]
    agents:
      review_lens:
        description: Functionality and quality review lens with trusted instructions.
        prompt: "{{ review_system_prompt }}"
    structured_tool:
      name: report_findings
      description: Submit the review findings and scores for this diff.
      input_schema: "{{ review_findings_schema }}"
  register: _cursor_review_raw

- name: "Cursor: fail loudly if the Security agent produced no structured output"
  ansible.builtin.assert:
    that:
      - _cursor_security_raw.structured is defined
    fail_msg: >-
      Security lens (agent_family=cursor) produced no .structured
      output -- the model did not call report_findings
      (status={{ _cursor_security_raw.status | default('unknown') }}).
      The model's draft is NOT printed here.

- name: "Cursor: fail loudly if the Review agent produced no structured output"
  ansible.builtin.assert:
    that:
      - _cursor_review_raw.structured is defined
    fail_msg: >-
      Review lens (agent_family=cursor) produced no .structured
      output -- the model did not call report_findings
      (status={{ _cursor_review_raw.status | default('unknown') }}).
      The model's draft is NOT printed here.

- name: "Cursor: fail closed if the Security agent fabricated structured output"
  ansible.builtin.include_tasks: assert_cursor_prompt_nonce.yml
  vars:
    cursor_nonce_structured: "{{ _cursor_security_raw.structured }}"
    cursor_nonce_lens_label: "Security lens"

- name: "Cursor: fail closed if the Review agent fabricated structured output"
  ansible.builtin.include_tasks: assert_cursor_prompt_nonce.yml
  vars:
    cursor_nonce_structured: "{{ _cursor_review_raw.structured }}"
    cursor_nonce_lens_label: "Review lens"

- name: "Cursor: build the normalized Security result"
  ansible.builtin.set_fact:
    security_result:
      structured:
        findings: "{{ _cursor_security_raw.structured.findings | default([]) }}"
        scores: "{{ _cursor_security_raw.structured.scores | default({}) }}"
      resolved_model: "{{ _cursor_security_raw.resolved_model | default(review_cursor_model) }}"
      usage_normalized: "{{ _cursor_security_raw.usage_normalized }}"

- name: "Cursor: build the normalized Review result"
  ansible.builtin.set_fact:
    review_result:
      structured:
        findings: "{{ _cursor_review_raw.structured.findings | default([]) }}"
        scores: "{{ _cursor_review_raw.structured.scores | default({}) }}"
      resolved_model: "{{ _cursor_review_raw.resolved_model | default(review_cursor_model) }}"
      usage_normalized: "{{ _cursor_review_raw.usage_normalized }}"
