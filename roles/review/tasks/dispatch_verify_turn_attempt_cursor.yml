---
# One dispatch attempt for current verify turn, cursor side.
#
# Same idea as dispatch_verify_turn_attempt_claude_cli.yml: one module
# call runs explore-then-verdict internally. Cursor cannot take
# plaibook's custom read_file/search/trace_reachability schemas (no
# parent system_prompt, no generation-time json_schema, custom tools
# only via structured_tool / mcp). Built-in read + report_verdict
# structured_tool stand in. Cursor uses the shared
# verify_verdict_schema (prompt_nonce required). Do not require a
# model-computed digest. Do not revive HMAC. Do not use a Cursor-only
# schema copy. Reachability is the model's own read of control flow,
# not trace_reachability.py -- same gap as claude_cli.
#
# Synthesize at most one report_verdict tool_use so verify_turn.yml's
# "dispatch any other tool calls" step sees an empty other-tools list
# and flips review_verify_done on the first outer turn when a verdict
# lands.
#
# tools: [mcp, task] -- same parent allowlist as the working
# security/review lenses. Do not offer read on the parent: luna then
# verifies itself and fabricates report_verdict without Task.
# AgentDefinition has no tools field; the spawned subagent uses the
# default filesystem tools. Do not revert to [read, mcp, task] or [mcp]
# alone.
#
# Agent name is verify_lens, not verify -- same collision as the
# explore parent named explore. Do not rename this back to verify.
#
# Parent prompt must name the Task / Subagent tool and tell the parent
# to spawn the named agent. Do not instruct the parent to call
# report_verdict itself. Consume structured_tool_calls with
# caller=nested. Ignore parent executes. Fail closed when the named
# lens never called the tool on the last verify turn; mid-turns with
# zero executes retry. Parent-only execute (GetDynamicTools /
# tools: [mcp] fabrication) always fails closed.
#
# prompt_nonce is a cheap spawn canary after a nested execute. The
# nested execute is the payload bind. Do not print .text in fail_msg.

- name: "Cursor: show this verify turn's request configuration"
  ansible.builtin.debug:
    msg:
      - "model: {{ review_verify_cursor_model }}"
      - "effort: {{ review_cursor_effort }}"
      - "cwd: {{ review_repo_path }}"
      - "setting_sources: []"
      - "tools: [mcp, task]"
      - "structured_tool: report_verdict (verify_verdict_schema)"

- name: "Cursor: dispatch the verify agent"
  aknochow.cursor.agent:
    api_key: "{{ review_cursor_api_key }}"
    prompt: >-
      Spawn the verify_lens subagent with the Task / Subagent tool.
      You must call the Task / Subagent tool -- verify_lens is not
      itself a tool. Do not refute the finding yourself. Do not call
      report_verdict yourself. Wait for verify_lens to finish.
    model: "{{ review_verify_cursor_model }}"
    effort: "{{ review_cursor_effort }}"
    cwd: "{{ review_repo_path }}"
    setting_sources: []
    tools: [mcp, task]
    agents:
      verify_lens:
        description: Adversarial single-finding verifier with trusted instructions.
        prompt: "{{ verify_system_prompt }}"
    structured_tool:
      name: report_verdict
      description: Submit the verification verdict for this one finding.
      input_schema: "{{ verify_verdict_schema }}"
  register: _cursor_verify_raw

- name: "Cursor: record this attempt's usage for the pipeline-wide stats summary"
  ansible.builtin.set_fact:
    pipeline_agent_calls: >-
      {{ pipeline_agent_calls + [{
           'target': review_org_repo + '#' + review_number, 'lens': 'verify',
           'model': _cursor_verify_raw.resolved_model | default(review_verify_cursor_model),
           'usage': _cursor_verify_raw.usage_normalized,
           'attempt': verify_attempt_number | default(1)
         }] }}

- name: "Cursor: consume Verify named-lens execute"
  ansible.builtin.include_tasks: select_cursor_named_lens.yml
  vars:
    cursor_raw: "{{ _cursor_verify_raw }}"
    cursor_nonce_lens_label: "Verify"
    cursor_lens_tool: report_verdict
    cursor_named_lens_required: "{{ verify_last_turn | default(false) }}"

- name: "Cursor: fail closed if the Verify named lens nonce mismatches"
  when: cursor_named_lens_present | default(false) | bool
  ansible.builtin.include_tasks: assert_cursor_prompt_nonce.yml
  vars:
    cursor_nonce_structured: "{{ cursor_lens_structured }}"
    cursor_nonce_lens_label: "Verify"

- name: "Cursor: build this attempt's synthesized report_verdict tool_use (if any)"
  ansible.builtin.set_fact:
    _cursor_verify_report_call: >-
      {{ [{'id': 'cursor_report_verdict',
           'name': 'report_verdict',
           'input': cursor_lens_structured}]
         if (cursor_named_lens_present | default(false) | bool) else [] }}

- name: "Cursor: normalize this attempt's result into the shared verify_turn_result shape"
  ansible.builtin.set_fact:
    verify_turn_result:
      message:
        content: "{{ _cursor_verify_report_call }}"
        model: "{{ _cursor_verify_raw.resolved_model | default(review_verify_cursor_model) }}"
      tool_calls: "{{ _cursor_verify_report_call }}"
      stop_reason: "{{ 'tool_use' if (cursor_named_lens_present | default(false) | bool) else (_cursor_verify_raw.status | default('unknown')) }}"
      usage: "{{ _cursor_verify_raw.usage_normalized }}"

- name: "Cursor: check whether this attempt produced a named-lens verdict"
  ansible.builtin.set_fact:
    _verify_cursor_structured_present: "{{ cursor_named_lens_present | default(false) | bool }}"

- name: "Cursor: mark this attempt valid unless it's the forced last turn with no verdict at all"
  ansible.builtin.set_fact:
    verify_dispatch_valid: "{{ (not verify_last_turn) or (_verify_cursor_structured_present | bool) }}"
