---
# Consume the named *_lens structured_tool execute, not parent last-call.
#
# aknochow.cursor.agent returns structured_tool_calls classified parent vs
# nested by joining execute tool_call_id to the parent run stream.
# Parent last-call (.structured) is a lie when both called. Do not
# revive HMAC. Do not treat a field inside args as caller identity.
# Do not print .text or payloads in fail_msg.
#
# Vars:
#   cursor_raw: module result
#   cursor_nonce_lens_label: human label
#   cursor_named_lens_required: if true (default), fail closed when
#     nested execute is missing. If false, parent-only still fails
#     closed (GetDynamicTools fabrication) but zero executes is "no
#     report yet" for explore/verify mid-turns.
#
# Among nested executes of cursor_lens_tool, bind the last whose
# args.prompt_nonce equals review_prompt_nonce. A later empty {} or a
# probe nonce (search-helper, probe, PROBE) does not replace that call
# (ansible-plaibook #159). Nested executes that exist and none carry
# the canary fail closed. Zero nested executes stay "no report yet"
# unless cursor_named_lens_required. Parent-only still fails closed.
#
# Sets:
#   cursor_lens_structured: args of the last nested canary execute
#   cursor_named_lens_present: bool

- name: "Cursor: split {{ cursor_nonce_lens_label }} structured_tool_calls"
  ansible.builtin.set_fact:
    _cursor_nested_calls: "{{ (cursor_raw.structured_tool_calls | default([])) | selectattr('caller', 'equalto', 'nested') | list }}"
    _cursor_parent_calls: "{{ (cursor_raw.structured_tool_calls | default([])) | selectattr('caller', 'equalto', 'parent') | list }}"

- name: "Cursor: fail closed if {{ cursor_nonce_lens_label }} only the parent called the tool"
  when: _cursor_parent_calls | length > 0 and _cursor_nested_calls | length == 0
  ansible.builtin.fail:
    msg: >-
      {{ cursor_nonce_lens_label }} (agent_family=cursor) had a parent
      {{ cursor_lens_tool | default('structured_tool') }} execute and no
      nested execute. The named *_lens subagent did not submit findings.
      Parent last-call is dispatch fabrication (including GetDynamicTools
      with tools: [mcp]), not a clean review. The model's draft is NOT
      printed here.

- name: "Cursor: fail closed if {{ cursor_nonce_lens_label }} named lens never called the tool"
  when:
    - cursor_named_lens_required | default(true) | bool
    - _cursor_nested_calls | length == 0
  ansible.builtin.fail:
    msg: >-
      {{ cursor_nonce_lens_label }} (agent_family=cursor) had no nested
      {{ cursor_lens_tool | default('structured_tool') }} execute. The
      named *_lens subagent did not submit findings. Do not use parent
      last-call. The model's draft is NOT printed here.

- name: "Cursor: reset canary matches for {{ cursor_nonce_lens_label }}"
  ansible.builtin.set_fact:
    _cursor_canary_calls: []

# selectattr('args.prompt_nonce') errors when a later execute is {} or
# JSON null. default(value) leaves null in place; default(value, true)
# treats null as empty so .prompt_nonce and | length do not crash.
# An undefined cursor_lens_tool does not match.
- name: "Cursor: keep nested executes whose prompt_nonce matches for {{ cursor_nonce_lens_label }}"
  ansible.builtin.set_fact:
    _cursor_canary_calls: "{{ _cursor_canary_calls + [item] }}"
  loop: "{{ _cursor_nested_calls }}"
  loop_control:
    label: nested
  when:
    - (review_prompt_nonce | default('', true)) | length > 0
    - cursor_lens_tool is defined and (item.name | default('')) == cursor_lens_tool
    - ((item.args | default({}, true)).prompt_nonce | default('', true)) == (review_prompt_nonce | default('', true))

- name: "Cursor: fail closed if {{ cursor_nonce_lens_label }} nested executes lack the canary"
  when:
    - _cursor_nested_calls | length > 0
    - _cursor_canary_calls | length == 0
  ansible.builtin.fail:
    msg: >-
      {{ cursor_nonce_lens_label }} (agent_family=cursor) had nested
      {{ cursor_lens_tool | default('structured_tool') }} executes, but
      none carried the per-run prompt_nonce. Empty payloads and probe
      nonces are not a completed review. This is dispatch fabrication,
      not a clean review. The model's draft is NOT printed here.

- name: "Cursor: bind the last nested canary execute for {{ cursor_nonce_lens_label }}"
  when: _cursor_canary_calls | length > 0
  ansible.builtin.set_fact:
    cursor_lens_structured: "{{ _cursor_canary_calls[-1].args }}"
    cursor_named_lens_present: true

- name: "Cursor: record no nested execute for {{ cursor_nonce_lens_label }}"
  when: _cursor_nested_calls | length == 0
  ansible.builtin.set_fact:
    cursor_named_lens_present: false
