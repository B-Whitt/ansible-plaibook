---
# Fail closed when the Cursor parent fabricates structured output
# without the named subagent running, or relays a nonce with a
# different payload.
#
# prompt_nonce lives in the subagent prompt (agents.*.prompt). Matching
# it rules out a parent that never saw that prompt. prompt_attestation
# is HMAC-SHA256(dispatcher key, canonical JSON of the payload without
# that field). A parent that copies the nonce and submits findings: []
# cannot produce a matching HMAC without hashing this exact payload.
# The key is also in the billed subagent prompt; a parent that both
# copies the nonce AND correctly HMACs a fabricated payload is still
# unguarded. Do not print .text, the HMAC key, or the payload.

- name: "Cursor: fail closed if {{ cursor_nonce_lens_label }} structured output fails nonce or HMAC attestation"
  attest_cursor_structured:
    structured: "{{ cursor_nonce_structured }}"
    hmac_key: "{{ review_prompt_hmac_key }}"
    nonce: "{{ review_prompt_nonce }}"
    lens_label: "{{ cursor_nonce_lens_label }}"
